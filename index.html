<script>const T=[];T.push({id:"family",n:"Ailə terapiyası",s:"Evdəki söhbətlər, rollar, təkrarlanan gərginlik",c:"#E07A5F",intro:"Ailə yaxın olduğu qədər də yorucu ola bilər. Bu test evdəki ünsiyyətin, sərhədlərin və yükün sənə necə təsir etdiyini ölçür.",dims:[["Ünsiyyət divarı","Yüksək nəticə: evdə açıq danışmaq və eşidilmək çətindir."],["Rollar və sərhədlər","Yüksək nəticə: rollar qarışıqdır, sərhədlərə hörmət azdır."],["Münaqişə dövrəsi","Yüksək nəticə: eyni mübahisələr təkrarlanır, barışıq çətindir."],["Yük və tənhalıq","Yüksək nəticə: ailənin yükü tək çiyinlərdədir."]],q:[["Evdə vacib mövzunu açmazdan əvvəl otaqdakı əhvalı hava proqnozu kimi yoxlayıram.",0],["Ailəmizdə bəzi mövzular qırmızı lentlə bağlanıb və heç kim toxunmur.",0],["Dediyim cümlələr sonradan mənə qarşı istifadə olunur.",0],["Ailə üzvü məni dinləyərkən telefona baxanda danışmaq istəyim itir.",0],["Evdə nə hiss etdiyimi sözlə deyə bilirəm və anlayışla qarşılanıram.",0,1],["Ailəmizdə uşaq böyük kimi, böyük isə uşaq kimi davranır.",1],["Şəxsi otağım, telefonum və ya vaxtım barədə yaxınlarım icazəsiz qərar verir.",1],['Ailədə "yox" demək xəyanət kimi qarşılanır.',1],["Yaxınlarımın hissləri ilə o qədər məşğulam ki, öz istəyimi xatırlamıram.",1],["Ailədə hər kəsin öz məkanı və sərhədləri hörmətlə qarşılanır.",1,1],["Mübahisə başlayanda sonunu bilirəm: eyni səhnə, eyni cümlələr, fərqli bəhanə.",2],["Xırda söz yeməkdən əvvəl başlayır, yatmazdan sonra da bitmir.",2],["Mübahisədən sonra günlərlə danışmamaq ailəmizdə adi haldır.",2],["Köhnə küskünlüklər hər yeni söhbətə gətirilir.",2],["Mübahisədən sonra üzr istəyib barışa bilirik.",2,1],["Ailənin ağırlığını sanki tək mən daşıyıram.",3],["Evdə olanda belə özümü tənha hiss edirəm.",3],["Çətin gündə yaxınlarımdan real yardım əvəzinə yalnız təsəlli sözləri alıram.",3],["Valideynlərə və ya uşaqlara qayğı iş qrafikimi və sağlamlığımı sıxışdırır.",3],["Ailədə ağır işlər ədalətli bölünür.",3,1]],a:[["Susqun Körpü","Sözlər qarşı sahilə çatmır.","Ailədə danışmaq riskli görünür, ona görə vacib hisslər deyilmir. Zamanla məsafə böyüyür, amma aranızdakı bağ hələ də qurula bilər.","Həftədə bir dəfə 15 dəqiqəlik telefonsuz süfrə söhbəti təyin edin.",'Cümləyə "sən" yox, "mən hiss edirəm" ilə başlayın.'],["Qarışıq Xəritə","Kimin harada durduğu bəlli deyil.","Rollar və sərhədlər bulanıqdır: kimisi həddindən çox məsuliyyət, kimisi isə nəzarət daşıyır. Bu, yorğunluq və qıcıq yaradır.","Kimin nəyə məsul olduğunu və nəyi seçə biləcəyini kağıza yazın.",'Bir kiçik "yox" cümləsini sakit tonla məşq edin.'],["Təkrar Fırtınası","Mübahisə eyni ssenari ilə gedir.","Mübahisələr yeni mövzu ilə, amma köhnə dövrə üzrə təkrarlanır. Problem çox vaxt mövzuda yox, necə danışmaqdadır.","Mübahisə qızanda 20 dəqiqəlik fasilə qaydası qoyun və sonra qayıdın.","Hər dəfə yalnız bir mövzu danışın, köhnə hesabları gətirməyin."],["Tək Daşıyan","Ağırlıq bir nəfərin çiyinindədir.","Ailənin yükünün böyük hissəsi səndədir və bu tənhalıq hissi yaradır. Dəstək istəmək zəiflik yox, yükü bölüşdürməkdir.","Yükləri siyahıya salın və bir işi konkret şəkildə başqa üzvə verin.","Özünüz üçün həftədə ən azı bir saat qoruyun."]],rec:"Ailə terapiyasında ən təsirli format ailə üzvlərinin birgə iştirakıdır; ilk görüşə təkbaşına gəlmək də mümkündür."}),T.push({id:"couple",n:"Cütlük terapiyası",s:"Etibar, ünsiyyət, yaxınlıq və ortaq gələcək",c:"#D6577F",intro:'Münasibətdə problem çox vaxt "kim haqlıdır" yox, "necə danışırıq" sualındadır. Bu test dörd əsas sahəni ayrıca ölçür.',dims:[["Ünsiyyət və dinlənilmə","Yüksək nəticə: eşidilmirsiniz, mübahisə mövzudan çıxır."],["Etibar və təhlükəsizlik","Yüksək nəticə: şübhə, qısqanclıq və ya köhnə yara hiss olunur."],["Yaxınlıq və qayğı","Yüksək nəticə: isti anlar azalıb, münasibət vəzifəyə çevrilib."],["Gələcək və uyğunluq","Yüksək nəticə: plan və dəyərlər fərqli istiqamətdədir."]],q:[["Partnyorumla danışanda ikimiz də eyni anda danışırıq və heç kim dinləmir.",0],['"Yaxşıyam" cavabım əslində "soruşma, tapsan yaxşıdır" deməkdir.',0],['Mübahisədə mövzu itir və söhbət "sən həmişə" və "sən heç vaxt" cümlələrinə çevrilir.',0],["Partnyorumun əhvalını üzündən oxuyuram, o isə mənimkini oxumur.",0],["Narahat olduğum şeyi partnyoruma qısa və sakit şəkildə deyə bilirəm.",0,1],["Partnyorumun telefon ekranı işıqlananda içimdə nəsə sıxılır.",1],["Keçmişdəki inam zədəsi hələ də aramızda görünməz üçüncü şəxs kimi dayanır.",1],["Verdiyi sözlərin yerinə yetəcəyinə tam əmin deyiləm.",1],["Yoxlamaq və ya izləmək istəyi yaranır, sonra özümü pis hiss edirəm.",1],["Partnyoruma arxayın şəkildə arxalana bilirəm.",1,1],["Eyni evdə yaşayırıq, amma sanki iki ayrı qrafikdə.",2],["Axırıncı dəfə səbəbsiz sevgi sözünü nə vaxt dediyimizi xatırlamıram.",2],["Qayğı əvəzinə yalnız vəzifələri bölüşürük: ödənişlər, uşaq, alış-veriş.",2],["Toxunuş və qucaqlaşma azalıb, bunu açıq danışmaq isə çətindir.",2],["Partnyorumla xırda şeylərə birlikdə gülürük.",2,1],["Gələcək barədə fikirlərimiz fərqli istiqamətə gedir: uşaq, yer, pul, karyera.",3],['Bəzən "biz hələ də eyni yoldayıq?" sualı ağlıma gəlir.',3],["Münasibətdə dəyişmək üçün yalnız mən çalışıram.",3],["Güzəştə gedəndə özümdən nəsə itirdiyimi hiss edirəm.",3],["Ortaq məqsədlərimiz var və onlar barədə birlikdə danışırıq.",3,1]],a:[["Dalğada Susan","Danışırıq, amma eşidilmirik.","Ünsiyyət kəsilir: ya ikiniz birdən danışırsınız, ya da biriniz geri çəkilir. Dinlənilmək ehtiyacı ödənmir və kiçik məsələlər böyüyür.",'Növbə ilə danışın: biri deyir, digəri təkrar edib "düzgün anladımmı?" soruşur.',"Həssas mövzuları yorğun axşam yox, sakit vaxtda açın."],["Şübhə Gözətçisi","Etibar ehtiyatla qorunur.","İnam zədələnib və ya qorxusu var; zehin daim təhlükə axtarır. Bu həm səni, həm münasibəti yorur.","Yoxlama istəyi gələndə onu yazın, sonra ehtiyacı partnyorla danışın.","Etibarın bərpası üçün aydın və ölçülə bilən razılaşmalar qurun."],["Soyuyan Ocaq","Qayğı vəzifəyə çevrilib.","Gündəlik işlər görülür, isti anlar azalıb. Yaxınlıq kiçik, təkrarlanan jestlərlə yenidən qurula bilər.","Gündə 6 saniyəlik səmimi qucaqlaşma və ya təşəkkür vərdişi yaradın.","Həftədə bir dəfə telefonsuz şam yeməyi planlayın."],["Ayrılan Yollar","Gələcək xəritələri üst-üstə düşmür.","Dəyərlər, planlar və güzəşt tərzi fərqlənir. Əsas sual: bu fərqlər birlikdə həll oluna bilərmi?","Hər biriniz 3 vacib dəyəri yazın və güzəştə getməyəcəyiniz birini ayırın.","Böyük qərarlardan əvvəl neytral mütəxəssislə mövqeləri aydınlaşdırın."]],rec:"Cütlük terapiyası iki nəfərlə keçir; partnyoru da dəvət etmək ən yaxşı nəticəni verir."}),T.push({id:"sexual",n:"Cinsəl terapiya",s:"Arzu, yaxınlıq, narahatlıq və bədən rahatlığı",c:"#A25BC8",intro:"Bu mövzuda çətinlik yaşamaq çox yayılmışdır və adətən müalicə olunur. Suallar yalnız ümumi, aydın və hörmətli formadadır.",dims:[["Arzu və maraq","Yüksək nəticə: yaxınlığa maraq və ya enerji azalıb."],["Performans gərginliyi","Yüksək nəticə: nəticə qorxusu və gərginlik ön plandadır."],["Yaxınlıq və danışıq","Yüksək nəticə: istəkləri danışmaq çətindir, utanc və məsafə var."],["Bədən və rahatlıq","Yüksək nəticə: bədənlə rahatlıq və ya fiziki narahatlıq problemi var."]],q:[['Yaxınlıq barədə düşünəndə maraq yox, "daha bir vəzifə" hissi yaranır.',0],["Cinsi marağım son dövrdə əvvəlkindən xeyli azalıb.",0],["Arzu tempim partnyorumunkundan fərqlidir və bu məni narahat edir.",0],["Günün sonunda yorğunluq və fikirlər yaxınlığa yer qoymur.",0],["Yaxınlıq istəyini rahat hiss edir və yaşaya bilirəm.",0,1],['Yaxınlıq zamanı beynimdə "alınacaqmı?" sualının səsi ucalır.',1],["Əvvəlki uğursuz təcrübə qorxusu sonrakı hər yaxınlığa kölgə salır.",1],["Gərginlik və narahatlıq bədənimin təbii cavabına mane olur.",1],["Partnyorun məndən nə gözlədiyini düşünməkdən özümə fokuslana bilmirəm.",1],["Yaxınlıq zamanı özümü sərbəst və qorxusuz hiss edirəm.",1,1],["İstəklərimi və ya narahatlığımı partnyorumla danışmaq mənə çətindir.",2],["Bu mövzuda söhbət açanda utanc və ya günahkarlıq hissi yaranır.",2],["Yaxınlıqdan sonra emosional olaraq özümü uzaq hiss edirəm.",2],["Mövzudan qaçmaq üçün yuxunu, işi və ya telefonu bəhanə edirik.",2],["Partnyorumla bu mövzuda açıq və sakit danışa bilirik.",2,1],["Öz bədənimə baxanda rahatlıq yox, tənqid hissi keçirirəm.",3],["Yaxınlıq zamanı fiziki narahatlıq və ya ağrı hiss edirəm.",3],["Bədən görünüşüm haqqında düşüncələr məni yaxınlıqdan çəkindirir.",3],["Hormonal, sağlamlıq və ya dərman dəyişikliyinin təsirini hiss edirəm.",3],["Bədənimlə aram yaxşıdır və ona etibar edirəm.",3,1]],a:[["Sönən Qığılcım","Maraq azalıb, səbəb gizlidir.","Arzunun azalması çox vaxt stress, yorğunluq, hormonal və ya münasibət amilləri ilə bağlıdır. Bu geniş yayılmış və müalicə oluna bilən haldır.","Yuxu, stress və sağlamlıq amillərini həkimlə yoxlayın.","Təzyiqsiz yaxınlıq üçün vaxt ayırın: söhbət, toxunuş, birgə istirahət."],["Səhnə Qorxusu","Beyin nəticəni izləyir.","Performans qorxusu bədənin təbii cavabına mane olur və dövrə yaradır. Diqqəti nəticədən hisslərə yönəltmək kömək edir.","Nəticə hədəfini götürüb hisslərə fokuslanan təzyiqsiz təcrübə cəhd edin.","Gündəlik nəfəs və əzələ boşaltma məşqi qurun."],["Danışılmayan Dil","Söz azdır, məsafə böyüyür.","Əsas çətinlik ünsiyyətdədir: istəklər və sərhədlər deyilmir, utanc isə susdurur. Açıq söhbət çox şeyi dəyişir.","Mövzunu yataqdan kənar, sakit məkanda açın.",'"Mənə xoş gələn şey..." cümləsi ilə başlayın.'],["Bədənlə Barışıq","Rahatlıq axtarılır.","Bədən obrazı, ağrı və ya sağlamlıq amilləri yaxınlığa təsir edir. Tibbi baxış və özünə yumşaq münasibət birlikdə işləyir.","Davamlı ağrı və ya narahatlıq üçün həkimə müraciət edin.","Bədəninizə gündə bir neytral və ya xoş cümlə ilə yanaşın."]],rec:"Bu mövzu həm psixoloji, həm tibbi ola bilər. Ağrı və ya fizioloji narahatlıq varsa əvvəlcə həkim müayinəsi tövsiyə olunur."}),T.push({id:"stress",n:"Stress",s:"Bədən, düşüncə, emosiya və bərpa",c:"#E3A52F",intro:'Stress yalnız "əsəbilik" deyil: bədənə, fikirlərə, əhvala və yuxuya eyni anda təsir edir. Test dörd qatı ayrıca göstərir.',dims:[["Bədən siqnalları","Yüksək nəticə: gərginlik bədəndə ağrı və simptom kimi görünür."],["Düşüncə yükü","Yüksək nəticə: zehin dayanmır, narahatlıq və qərar yorğunluğu var."],["Emosional dözümlülük","Yüksək nəticə: hisslər tez qalxır, qıcıq və boşalma çətinliyi var."],["Bərpa və yuxu","Yüksək nəticə: yuxu və istirahət bərpa etmir."]],q:[["Çiynimdə görünməz çanta var: boyun və çiyin gərginliyi yox olmur.",0],["Başım ağrıyır, mədəm sıxılır və ya ürək döyüntüm sürətlənir.",0],["Dişlərimi sıxıram və ya bilmədən yumruğumu düyünləyirəm.",0],["Stresli günlərdə iştaham ya yox olur, ya da nəzarətsiz artır.",0],["Bədənim gərginləşəndə nəfəs və ya hərəkətlə onu sakitləşdirə bilirəm.",0,1],["Yataqda beynim sabahın siyahısını yenidən oxuyan radio kimidir.",1],["Hələ baş verməmiş problemləri zehnimdə dəfələrlə canlandırıram.",1],["Qərar verməkdə çətinlik çəkirəm, çünki hər variantın riski görünür.",1],["Diqqətim azalıb və sadə şeyləri unuduram.",1],["Narahatlıq gələndə fikirlərimi yazıb və ya danışıb yüngülləşdirə bilirəm.",1,1],["Xırda hadisə (səs, gecikmə, xəta) məni qeyri-mütənasib dərəcədə əsəbiləşdirir.",2],["Stresimi yaxınlarıma çıxarıb sonra peşman oluram.",2],["Son vaxtlar sevinc gətirən şeylər də yük kimi görünür.",2],["Özümü hər an partlamağa hazır qazan kimi hiss edirəm.",2],["Çətin hisslərimi sakit və aydın şəkildə idarə edə bilirəm.",2,1],["Yatağa gedirəm, amma yuxu gəlmir və ya tez-tez oyanıram.",3],['Yuxudan dincəlmiş yox, "başlamamış yorulmuş" kimi qalxıram.',3],["Dincəlmək üçün vaxt ayıranda günahkarlıq hissi keçirirəm.",3],["Həftədə bir gün belə tam söndürə bilmirəm.",3],["Gün ərzində real fasilələrim və dincəlmə vaxtım olur.",3,1]],a:[["Bədən Alarmı","Gərginlik əzələlərdə yaşayır.","Stress əsasən bədən siqnalları ilə özünü göstərir: ağrı, gərginlik, ürək döyüntüsü. Bədəni sakitləşdirmək ilk addımdır.","Gündə 3 dəfə nəfəs məşqi: 4 saniyə içəri, 6 saniyə bayıra.","Həftədə 3 dəfə 20 dəqiqəlik yeriş."],["Fırlanan Beyin","Fikirlər dayanmır.","Zehin daim problem həll etməyə çalışır və yorur. Fikirləri sistemə salmaq yükü xeyli yüngülləşdirir.","Yatmazdan əvvəl 5 dəqiqə narahatlıq siyahısı yazın.",'Hər narahatlığı "nəzarət edə bilərəm / edə bilmirəm" kimi ayırın.'],["Qaynayan Qazan","Emosiyalar sərhədə çatıb.","Dözümlülük həddinə yaxınsan: xırda şeylər böyük reaksiya doğurur. Boşaltma vərdişləri və sərhədlər önəmlidir.","Qıcıq gələndə 10 dəqiqəlik hərəkət edin: yeriş, pilləkən.","Danışa biləcəyiniz bir etibarlı insan müəyyən edin."],["Yorğun Gecəçi","Dincəlmə tam olmur.","Yuxu və bərpa pozulub; bədən və zehin yenilənmir. Bu isə stresi daha da artırır.","Eyni vaxtda yatıb durmağı 2 həftə sınayın.","Yatmazdan 1 saat əvvəl ekranı və kofeini azaldın."]],rec:"Yüngül stress öz-özünə idarə oluna bilər. 2 həftədən çox davam edərsə və yuxu və ya iş pozularsa psixoloqa müraciət edin."}),T.push({id:"depression",n:"Depressiya",s:"Əhval, enerji, özünə baxış və gündəlik funksiya",c:"#4C78C9",intro:"Bu, diaqnoz testi deyil; son iki həftəni əhatə edən ilkin skrininqdir. Cavabları son 14 günə görə ver.",dims:[["Əhval və sevinc","Yüksək nəticə: kədər, boşluq və ya zövq itkisi üstündür."],["Enerji və motivasiya","Yüksək nəticə: hərəkətə keçmək və başlamaq çətindir."],["Özünə baxış və ümid","Yüksək nəticə: özünü tənqid və ümidsizlik düşüncələri güclüdür."],["Gündəlik funksiya","Yüksək nəticə: yuxu, iştaha, diqqət və fəaliyyət pozulub."]],q:[["Əvvəl zövq aldığım şeylər indi rəngsiz televizor kimidir.",0],["Gündə əsas hissə boşluq, kədər və ya hissizlik üstünlük təşkil edir.",0],["Yaxşı xəbərə də ürəkdən sevinə bilmirəm.",0],["Ağlamaq istəyirəm, amma ya yaş gəlmir, ya da səbəbini bilmirəm.",0],["Son iki həftə gülmək və gündən zövq almaq mənim üçün mümkün olub.",0,1],["Ayağa qalxmaq, duş almaq və ya qapını açmaq dağ qalxmaq kimidir.",1],["Başladığım işləri yarımçıq qoyuram, çünki enerjim bitir.",1],["Telefona uzun müddət baxıram, amma heç nə qəbul etmirəm.",1],["Adi gündəlik işlər iradə tələb edən layihəyə çevrilib.",1],["Gün ərzində hərəkətə keçmək üçün kifayət qədər güc tapıram.",1,1],["Daxilimdəki səs mənə yalnız nöqsanlarımı sadalayır.",2],['Gələcəyi düşünəndə "nə fərqi var?" hissi yaranır.',2],["Sanki başqalarına yükəm və ya onlar mənsiz daha yaxşı olardı.",2],["Son vaxtlar yaşamaq istəməmək və ya özümə zərər vermək fikri ağlımdan keçib.",2,0,1],["Gələcək üçün ən azı kiçik, ümidverici planlarım var.",2,1],["Yuxum ya xeyli azalıb, ya da çox yatıram, amma yenə dincəlmirəm.",3],["İştaham nəzərəçarpacaq dərəcədə dəyişib.",3],["Oxumaq, söhbət etmək və ya film izləmək kimi sadə işlərdə diqqətimi cəmləyə bilmirəm.",3],["İşdə, evdə və ya dərsdə fəaliyyətim əvvəlkindən xeyli düşüb.",3],["Gündəlik işlərimi (yemək, yuxu, iş) böyük çətinlik çəkmədən idarə edirəm.",3,1]],a:[["Boz Pərdə","Sevinc rəngini itirib.","Əhval və zövq hissi azalıb. Bu, iradə zəifliyi deyil; peşəkar dəstəklə yaxşılaşan haldır.","Gündə bir kiçik xoş fəaliyyət planlayın, 5 dəqiqə də kifayətdir.","Hisslərinizi ən azı bir insanla paylaşın."],["Boş Batareya","Enerji və motivasiya bitib.","Hərəkətə keçmək ağırdır. Böyük hədəflər yox, çox kiçik addımlar daha real nəticə verir.","Bir işi 5 dəqiqəlik hissəyə bölün və yalnız birincini edin.","Gündüz işığında qısa yeriş əlavə edin."],["Daxili Hakim","Özünə sərt səs yüksəlir.","Özünü tənqid və ümidsizlik düşüncələri üstündür. Bu düşüncələr həqiqət deyil, depressiyanın dilidir.",'Sərt düşünəndə "dostuma belə deyərdimmi?" sualını verin.',"Bu düşüncələri mütəxəssislə paylaşın."],["Sönən Ritm","Yuxu, iştaha və diqqət pozulub.","Gündəlik funksiya zəifləyib. Rejimi bərpa etmək və tibbi baxış kömək edir.","Yuxu və yemək saatlarını sabitləşdirin.","Qan analizi (B12, D vitamini, tiroid) üçün həkimə baş çəkin."]],rec:"İki həftədən çox davam edən depressiv əlamətlər üçün psixoloq və ya psixiatr dəstəyi tövsiyə olunur. Bu test diaqnoz qoymur."}),T.push({id:"panic",n:"Panik atak",s:"Qəfil qorxu, bədən siqnalları və qaçınma",c:"#D9534F",intro:"Panik atak qorxuducu hiss olunsa da təhlükəli deyil və yaxşı müalicə olunur. Test ataqın hansı hissəsinin səni ən çox yorduğunu göstərir.",dims:[["Bədən təlaşı","Yüksək nəticə: ürək, nəfəs və titrəmə siqnalları güclüdür."],["Fəlakət düşüncələri",'Yüksək nəticə: siqnallar "təhlükəli" kimi şərh olunur.'],["Qorxu qorxusu və qaçınma","Yüksək nəticə: növbəti atak qorxusu həyatı daraldır."],["Nəzarət itkisi","Yüksək nəticə: atak zamanı sükan əldən çıxır."]],q:[["Ürəyim qəfil elə döyünür ki, sanki qəfəs içində quş çırpınır.",0],["Nəfəs ala bilmirəm və ya sinəmdə sıxılma hiss edirəm.",0],["Əllərim və ayaqlarım titrəyir, uyuşur və ya qarışqalanır.",0],["Başgicəllənmə, ürəkbulanma və ya həddindən artıq tərləmə yaşayıram.",0],["Bədənimdə bu cür siqnallar yaranmır və ya tez keçir.",0,1],['Ürək döyüntüsü artanda ilk fikrim: "bu ürək tutmasıdır".',1],['Qəfildən "dəli olacağam" və ya "huşumu itirəcəyəm" düşüncəsi yaranır.',1],["Atak zamanı ölüm qorxusu ağlımı tamamilə ələ keçirir.",1],["Həkim hər şey qaydasındadır dedikdən sonra da qorxu qalır.",1],["Narahatlıq gələndə bunun keçici olduğunu özümə xatırlada bilirəm.",1,1],["Növbəti ataqın nə vaxt gələcəyini gözləyirəm və bu gözləmə özü yorur.",2],["Metro, lift, izdiham və ya yol kimi yerlərdən qaçmağa başlamışam.",2],["Evdən yalnız yanımda biri olanda rahat çıxıram.",2],["Atak olmuş yerlərə qayıtmaqdan çəkinirəm.",2],["Atak ola biləcəyini düşünsəm də planlarımı dəyişmirəm.",2,1],['Atak başlayanda "bunu dayandıra bilmirəm" hissi çox güclüdür.',3],["Atakdan sonra tükənmiş və utanmış hiss edirəm, bunu gizlədirəm.",3],['Hər dəfə içimdə "bu dəfə həqiqətən təhlükəlidir" səsi olur.',3],["Kofein, yuxusuzluq və stress ataqları artırır, amma bunu idarə edə bilmirəm.",3],["Atak başlayanda nəfəs və ya əsaslandırma texnikaları mənə kömək edir.",3,1]],a:[["Əlarm Düyməsi","Bədən yalançı həyəcan verir.","Bədən siqnalları güclüdür və təhlükəli kimi oxunur. Bu siqnallar adətən təhlükəsizdir və bir neçə dəqiqəyə keçir.","Atak anında nəfəs: 4 saniyə içəri, 6 saniyə bayıra.","Ürək üçün bir dəfə həkim yoxlaması etdirin."],["Fəlakət Rejissoru","Zehin ən pis ssenarini çəkir.","Düşüncələr bədən siqnalını fəlakət kimi şərh edir. Düşüncəni dəyişmək ataqların gücünü azaldır.",'Özünüzə deyin: "Bu panik atakdır, keçəcək."','Fəlakət düşüncəsini yazın və "dəlil / əks dəlil" sütunları qurun.'],["Qaçan Kölgə","Qorxudan qaçmaq həyatı daraldır.","Qaçınma qısa müddət rahatlıq verir, uzun müddətdə qorxunu böyüdür. Pilləli üzləşmə ən effektiv üsuldur.","Qorxulu yerləri 1-dən 10-a çətinliyə görə sıralayın.","Ən yüngül olandan başlayıb tədricən üzləşin."],["Sükan İtkisi","Nəzarət itirmə hissi güclüdür.","Nəzarəti itirmək qorxusu ataqı uzadır. Qəbul etmə və əsaslandırma bacarığı sükanı geri qaytarır.","Beş duyğu məşqi: 5 şey gör, 4 şeyə toxun, 3 səs eşit.","Atakdan sonra özünüzə qınaq yox, dəstək cümləsi deyin."]],rec:"Panik ataklar koqnitiv-davranış terapiyası ilə yaxşı müalicə olunur. İlk dəfə yaşayırsınızsa ürək və tiroid üçün həkim baxışı etdirin."}),T.push({id:"work",n:"İş stressi və tükənmə",s:"Burnout, sinizm, təsirlilik və iş-həyat balansı",c:"#2F9E8F",intro:"Tükənmə (burnout) yalnız yorğunluq deyil: yorğunluq, işdən uzaqlaşma və təsirsizlik hissi üçlüyüdür. Test bunlara iş-həyat balansını da əlavə edir.",dims:[["Emosional tükənmə","Yüksək nəticə: enerji işə gedir, istirahət bərpa etmir."],["Sinizm və uzaqlaşma","Yüksək nəticə: işə və insanlara soyuqluq, məna itkisi var."],["Peşəkar təsirsizlik","Yüksək nəticə: nəticə hissi və özünə inam azalıb."],["İş-həyat balansı","Yüksək nəticə: iş şəxsi həyatın üzərinə keçib."]],q:[['Bazar günü axşamı içimdə "başlayır" siqnalı çalır.',0],["İşdən qayıdanda enerjimin son damlasını belə işə verdiyimi hiss edirəm.",0],["Səhər ofisə, ekrana və ya iş telefonuna baxmaq belə yorucudur.",0],["Məzuniyyətdən sonra belə dincəlmiş hiss etmirəm.",0],["İş günümdən sonra özümə və yaxınlarıma ayıracaq enerjim qalır.",0,1],["İşimin mənasından danışanda içimdə yalnız ironik təbəssüm yaranır.",1],["Həmkarlara, müştərilərə və ya komandaya qarşı soyuqluq və qıcıq artıb.",1],['İşdə tez-tez "nə fərqi var?" düşüncəsi ağlıma gəlir.',1],["İşimdən danışanda sanki başqasının işindən danışıram.",1],["İşimdə hələ də məqsəd və maraq görürəm.",1,1],["Əvvəl asan olan tapşırıqlar indi daha çox vaxt aparır.",2],['Çox işləsəm də "heç nə etmədim" hissi qalır.',2],["Peşəkar bacarıqlarıma inamım azalıb.",2],["Daha çox səhv edirəm və bu məni narahat edir.",2],["İşimdə nəticə əldə edirəm və bununla fəxr edirəm.",2,1],["İş mesajları və zəngləri iş saatlarından sonra və həftə sonu da məni tapır.",3],['"Yox" deməkdə çətinlik çəkirəm, çünki məsuliyyət və təzyiq var.',3],["Ailə, dostlar və şəxsi maraqlarım iş səbəbindən arxa plana keçib.",3],["Maaş və ya karyera narahatlığı mənə dincəlməyə imkan vermir.",3],["İş və şəxsi həyat arasında sağlam sərhədim var.",3,1]],a:[["Boşalan Batareya","Enerji gün sonunda sıfırdır.","Emosional tükənmə burnout-un əsas əlamətidir. Bərpa yalnız istirahət yox, yükün və sərhədlərin dəyişməsini tələb edir.","Həftədə 2 axşamı iş fikirlərindən tam azad saxlayın.","Rəhbərlə yük bölgüsü barədə konkret söhbət planlayın."],["Soyuq Maska","Məsafə və kinayə artıb.","İşə münasibət soyuqlaşıb, sinizm artıb. Bu, çox vaxt özünü qorumaq reaksiyasıdır.","İşdə hələ də mənalı qalan bir vəzifəni müəyyən edin.","Gündə bir kiçik real uğuru qeyd edin."],["Dişlisiz Çarx","Çox çalışırsan, nəticə hiss etmirsən.","Peşəkar təsirlilik hissi zəifləyib. Bu, qabiliyyət itkisi yox, tükənmənin nəticəsi ola bilər.","Ölçülə bilən 3 həftəlik mini hədəflər qurun.","Tapşırıqları azaldın: yalnız ən vacib 3-ü seçin."],["Həmişə Onlayn","İş həyatı yeyib.",'İş ilə şəxsi həyat arasında sərhəd yoxdur. Rəqəmsal sərhədlər və "yox" deməyi öyrənmək əsasdır.',"İş saatlarından sonra iş bildirişlərini söndürün.",'Həftədə bir "yox" cümləsi hazırlayın və tətbiq edin.']],rec:"Ağır burnout-da yalnız fərdi səy yetmir: iş yükü, rol və istirahət məsələlərini psixoloq və rəhbərlə birgə həll etmək tövsiyə olunur."}),T.push({id:"narc",n:"Narsisist münasibət",s:"Narsisist davranışlı yaxının sənə təsiri",c:"#7A6AD8",intro:"Yaxınında özünü həmişə haqlı sayan, tənqidə dözməyən, diqqət tələb edən biri varsa, bu test münasibətin SƏNƏ necə təsir etdiyini ölçür. Başqasına diaqnoz qoymur.",dims:[["Reallıq çaşqınlığı","Yüksək nəticə: xatirələrin və hisslərin şübhə altına alınır."],["Emosional dövrə","Yüksək nəticə: yaxşı və pis günlərin növbələşməsi sənə asılılıq yaradır."],["Sərhədlərin itməsi","Yüksək nəticə: öz istəklərin və qərarların arxa plandadır."],["Özgüvən və təcrid","Yüksək nəticə: özünə inam və dəstək dairən azalıb."]],q:[['Bir hadisəni xatırladığım kimi danışanda "belə olmayıb, uydurursan" cavabı alıram.',0],['Özümdən soruşuram: "mən həqiqətən həssasam, yoxsa o haqlıdır?"',0],["Onunla söhbətdən sonra məntiq yox, çaşqınlıq qalır.",0],['Dediyi sözdən sonra "mən belə deməmişəm" cavabı gəlir.',0],["Fikirlərim və xatirələrim onun yanında inamla qəbul olunur.",0,1],["Onun əhvalı günümün havasını müəyyən edir.",1],["Bir gün mənə hər şey verir, bir gün isə məni görünməz edir.",1],["Üzr istəyəndə belə günahkar mən qalıram.",1],['Hər dəfə "növbəti dəfə düzələr" ümidi ilə qalıram.',1],["Münasibətdə qarşılıqlı hörmət və sabitlik hiss edirəm.",1,1],['Ona "yox" dedikdən sonra sükut, qəzəb və ya intiqam gözləyirəm.',2],["Onun istəyini yerinə yetirmək üçün öz ehtiyaclarımı ardıcıl ləğv edirəm.",2],["Geyim, görüş və pul kimi qərarlarım onun təsdiqindən asılıdır.",2],['"Əgər bunu etməsəm, məni atar" qorxusu içimdə yaşayır.',2],["Ona sərhədlərimi sakitcə deyə bilirəm və o bunu qəbul edir.",2,1],["Əvvəl özümə güvənirdim, indi qərar verməkdə çətinlik çəkirəm.",3],["Onunla münasibətdən sonra dostlarım və ailəmlə əlaqəm azalıb.",3],["Onun tərifini və ya diqqətini qazanmaq üçün bütün gücümü sərf edirəm.",3],['Daxili səsim "sən kifayət qədər yaxşı deyilsən" cümləsini onun sözləri kimi təkrarlayır.',3],["Dəstək dairəm var və onlarla açıq danışıram.",3,1]],a:[["Dumanlı Güzgü","Öz reallığına şübhə yaranır.","Dediyin sözlər və xatirələrin dəyişdirilir, bu isə çaşqınlıq yaradır. Hadisələri yazıb saxlamaq güclü dayaqdır.","Vacib söhbətləri tarixlə qısa qeydlərdə saxlayın.","Reallığı yoxlamaq üçün etibarlı üçüncü şəxslə danışın."],["Qarmaqlı Bağ","Yaxşı və pis günlər arasında dövrə.","Qiymətləndirmə və dəyərsizləşdirmə növbələşir və emosional asılılıq yaradır. Dövrəni tanımaq ilk addımdır.","Yaxşı və pis günləri iki sütunda qeyd edin.","Qərar verərkən hisslərinizə yox, faktlar sütununa baxın."],["Silinən Sərhəd","Öz istəyin arxa plandadır.",'Sərhədlərin tədricən itib və qərarların onun təsdiqindən asılıdır. Kiçik "yox"lar böyük dəyişikliyin başlanğıcıdır.',"Gündə bir kiçik şəxsi qərarı təkbaşına verin.","Təhlükəsizlik planı üçün mütəxəssislə danışın."],["Sönən Səs","Özgüvən və dəstək dairəsi azalıb.","Özünə inam azalıb və təcrid artıb. Dəstək dairəsini bərpa etmək ən vacib addımdır.","Köhnə bir dostunuza qısa mesaj yazın.","Gündə özünüzün 3 güclü tərəfini yazın."]],rec:"Fiziki və ya cinsi zorakılıq, təqib və təhdid varsa dərhal 112-yə müraciət edin. Terapiya qərarlarını təhlükəsiz şəkildə qurmaqda kömək edir."}),T.push({id:"breakup",n:"Ayrılıq problemləri",s:"Yas, düşüncə dövrələri, tənhalıq və davam etmək",c:"#5E8FA3",intro:"Ayrılıq itkidir və yas tutmaq normaldır. Test ağrının harada ilişdiyini göstərir: hiss, düşüncə, kimlik, yoxsa əlaqə.",dims:[["Yas və itki ağrısı","Yüksək nəticə: kədər hələ canlıdır, bədən və gündəlik rejim təsirlənib."],["Düşüncə dövrələri","Yüksək nəticə: eyni düşüncələr dövrə vurur, keçmişə qayıdırsan."],["Tənhalıq və kimlik",'Yüksək nəticə: "biz" olmadan özünü itirmiş hiss edirsən.'],["Davam etmək və sərhəd","Yüksək nəticə: əlaqə və ya bağlılıq tam kəsilməyib."]],q:[["Ayrılıqdan sonra dünya səssiz rejimə keçdi.",0],["Ona aid kiçik bir şey (mahnı, qoxu, yer) gözlənilmədən məni yıxır.",0],["Gün ərzində dalğa-dalğa ağlamaq və ya boğazda düyün gəlir.",0],["İştaham, yuxu və enerji ayrılıqdan sonra pozulub.",0],["Ayrılığın ağrısı azalır və gündəlik həyatda rahatlıq tapıram.",0,1],['"Başqa cür etsəydim?" sualı zehnimdə təkrar oynayan film kimidir.',1],["Onun sosial şəbəkə hesablarına baxıram və sonra özümü daha pis hiss edirəm.",1],["Günahı ya özümdə, ya onda axtarıram, amma nəticə yoxdur.",1],["Barışıq ssenarilərini zehnimdə dəfələrlə qururam.",1],["Keçmişi düşünəndə fikirlər tez keçir və mənə yük olmur.",1,1],['"Biz" olmayanda mənim kim olduğum sualı məni qorxudur.',2],["Evdə, işdə və ya dostlar arasında özümü tənha və görünməz hiss edirəm.",2],["Ortaq xatirələr, dostlar və planlar arasında yer tapmaq çətindir.",2],["Təkbaşına yaşamaq və ya qərar vermək fikri məni qorxudur.",2],["Təkbaşıma özümü xoşbəxt və tam hiss edə bilirəm.",2,1],["Ona yazmaq və ya zəng etmək istəyini saxlamaqda çətinlik çəkirəm.",3],['Ayrılıqdan sonra da onunla əlaqə və ya "dost qalmaq" davam edir.',3],["Yeni insanlarla tanışlıq fikri məni yorur və ya qorxudur.",3],["Ev, pul və ya uşaq məsələləri ayrılığı bitirməyə imkan vermir.",3],["Keçmiş münasibətdən sonra öz hədlərimi və qərarlarımı aydın görürəm.",3,1]],a:[["Dalğalı Sahil","Kədər dalğa-dalğa gəlir.","Yas və itki ağrısı hələ canlıdır. Bu, normal prosesdir və öz tempində yaşanmalıdır.","Hisslərə gündə 15 dəqiqə ayırın: yazı və ya səs yazısı.","Yuxu, yemək və hərəkət rejimini qoruyun."],["Təkrarlanan Kadr","Zehin eyni filmi oynadır.","Eyni düşüncə dövrü sağalmanı ləngidir. Düşüncələri yazıb məhdud vaxt ayırmaq kömək edir.",'"Düşüncə vaxtı" təyin edin: gündə 20 dəqiqə, sonra başqa işə keçin.',"Onun sosial şəbəkə hesablarını susdurun."],["Yarım Güzgü",'"Biz"siz kim olduğunu axtarırsan.',"Kimlik və tənhalıq hissi ön plandadır. Öz maraqlarını və dəyərlərini bərpa etmək əsasdır.","Münasibətdən əvvəl sevdiyiniz fəaliyyətə qayıdın.","Həftədə ən azı 2 sosial görüş planlayın."],["Bağlanmayan Qapı","Əlaqə hələ tam kəsilməyib.",'Əlaqə və ya "dost qalmaq" ağrını uzadır. Aydın sərhəd sağalmanın şərtidir.',"30 günlük əlaqəsiz dövr təyin edin.","Ortaq məsələləri yalnız qısa, faktiki mesajlarla həll edin."]],rec:"Ayrılıq yası normaldır. 6-8 həftədən çox yuxu və iş pozulursa mütəxəssis dəstəyi faydalıdır."});const QS={family:[["Evdə nə düşündüyümü açıq deyə bilmirəm.",0],["Ailəmdə bəzi mövzulardan heç kim danışmaq istəmir.",0],["Nə desəm, sonra mənə qarşı istifadə olunur.",0],["Mən danışanda ailəm məni dinləmir.",0],["Ailəmdə hisslərimi rahat deyə bilirəm və məni başa düşürlər.",0,1],["Evdə kimin nəyə görə məsul olduğu aydın deyil.",1],["Ailəm mənim şəxsi işlərimə (telefon, otaq, vaxt) icazəsiz qarışır.",1],['Ailəmə "yox" demək çətindir, deyəndə məni günahlandırırlar.',1],["Ailəmin istəyini öz istəyimdən üstün tuturam.",1],["Ailəmdə hər kəsin şəxsi məkanına hörmət olunur.",1,1],["Ailəmizdə eyni mövzuda dəfələrlə mübahisə edirik.",2],["Kiçik məsələ tez böyük mübahisəyə çevrilir.",2],["Mübahisədən sonra bir-birimizlə günlərlə danışmırıq.",2],["Mübahisədə köhnə məsələləri yenidən üzə çıxarırıq.",2],["Mübahisədən sonra üzr istəyib barışırıq.",2,1],["Ailənin işlərinin çoxunu tək mən görürəm.",3],["Ailəmlə bir yerdə olanda belə özümü tənha hiss edirəm.",3],["Çətin olanda ailəmdən real kömək görmürəm.",3],["Ailəyə qayğı göstərməkdən özümə vaxt qalmır.",3],["Ailədə işlər ədalətli bölünür.",3,1]],couple:[["Partnyorumla danışanda bir-birimizi dinləmirik.",0],["Mübahisə edəndə əsas mövzu itir və bir-birimizi günahlandırırıq.",0],['Narahat olanda "yaxşıyam" deyirəm, amma əslində yaxşı deyiləm.',0],["Partnyorum məni başa düşmür kimi hiss edirəm.",0],["Narahat olduğum şeyi partnyoruma sakit şəkildə deyə bilirəm.",0,1],["Partnyorumun dediklərinə tam inanmıram.",1],["Keçmişdəki etibarsızlıq hadisəsi hələ də aramızdadır.",1],["Partnyorumun telefonuna və ya harada olduğuna çox baxıram.",1],["Partnyorumu itirmək qorxusu məni narahat edir.",1],["Partnyoruma tam etibar edirəm.",1,1],["Partnyorumla bir evdəyik, amma bir-birimizə uzağıq.",2],["Bir-birimizə xoş söz deməyi unutmuşuq.",2],["Aramızda daha çox gündəlik işlər və vəzifələr danışılır.",2],["Qucaqlaşma və toxunuş azalıb.",2],["Partnyorumla birlikdə gülüb xoş vaxt keçiririk.",2,1],["Gələcək planlarımız bir-birinə uyğun gəlmir.",3],['Bəzən "biz bir yerdə qalmalıyıq?" sualı ağ rakılıq və ya qorxu varsa, uşaqlar gərginlikdən pis təsirlənirsə, yaxud yaxın adamlardan biri depressiyada və ya asılılıqdadırsa mütəxəssisə gecikmədən müraciət edin. Zorakılıq və ya təhlükə halında dərhal 112-yə zəng edin."},couple:{d:['Münasibətinizdə danışıq var, amma anlaşma azdır. Biriniz danışanda digəriniz cavab hazırlayır, mübahisədə mövzu itir və bir-birinizi günahlandırırsınız. "Məni başa düşmürlər" hissi ilə susursunuz və ya partlayırsınız. Bu, ən çox yayılmış və düzəlmə şansı ən yüksək olan problemdir.','Etibar zədələnib. Səbəb keçmiş xəyanət, yalan, qısqanclıq və ya sadəcə təhlükəsizlik hissinin olmaması ola bilər. Zehniniz daim "nəsə səhvdir" siqnalı verir, yoxlamaq istəyi yaranır, sonra özünüzü pis hiss edirsiniz. Bu həm sizi, həm partnyorunuzu yorur və yaxınlığı azaldır.',"Münasibətiniz isti bağdan çox, ortaq iş bölgüsünə çevrilib. Gündəlik məsələlər danışılır, xoş sözlər, qucaqlaşma və birgə gülüş azalıb. Yaxında olsanız da uzaq hiss edirsiniz. Bu, çox vaxt yorğunluq və vaxtsızlıqdan başlayır, amma danışılmasa soyuqluğa çevrilir.","Gələcək haqqında fikirləriniz ayrılır: uşaq, yaşayış yeri, pul, karyera və ya həyat tərzi. Güzəştə gedən tərəf özünü itirmiş, çalışmayan tərəf isə təzyiq altında hiss edə bilər. Əsas sual budur: fərqlər birlikdə danışılıb həll oluna bilərmi, yoxsa ciddi uyğunsuzluq var?"],w:"Dəstək alınmasa, bu çətinliklər tədricən böyüyə bilər. Danışılmayan məsələlər küskünlüyə, etibarsızlıq isə daimi şübhəyə və nəzarətə çevrilir. Yaxınlıq azaldıqca tərəflər bir-birindən uzaqlaşır və münasibətdən kənarda dəstək axtarışı başlaya bilər. Sonda münasibət ayrılığa, uşaqlı ailələrdə isə ailənin dağılmasına qədər gedib çıxa bilər. Erkən mərhələdə mütəxəssis dəstəyi ilə bərpa şansı xeyli yüksəkdir.",n:"Biriniz münasibətdən getməyi ciddi düşünürsə, xəyanət baş veribsə, söhbət etmək artıq mümkün deyilsə və ya təhqir, təzyiq, qorxu varsa mütəxəssisə müraciət edin. Zorakılıq halında 112-yə zəng edin."},sexual:{d:["Cinsi marağınız və ya istəyiniz azalıb. Bu çox vaxt yorğunluq, stress, yuxu, hormonal dəyişiklik, dərman və ya münasibətdəki gərginliklə bağlıdır. Yaxınlığı vəzifə kimi görə və özünüzü günahkar hiss edə bilərsiniz. Azalmış istək xəstəlik deyil, amma səbəbi araşdırılmalıdır.",'Yaxınlıq zamanı "alınacaqmı?" qorxusu ön plandadır. Bu qorxu bədəninizin təbii reaksiyasına mane olur, uğursuzluq təcrübəsi yaranır və növbəti dəfə qorxu daha da artır. Dövrə yaranır. Diqqəti nəticədən hisslərə yönəltmək və gərginliyi azaltmaq çox kömək edir.',"İstəkləriniz, narahatlığınız və sərhədləriniz partnyorunuzla danışılmır. Utanc və günahkarlıq hissi susdurur, söz yerinə təxminlər və küskünlük yaranır. Yaxınlıq problemlərinin böyük hissəsi məhz danışılmadığına görə böyüyür.","Bədənlə bağlı narahatlıq yaxınlığa təsir edir. Bu, öz görünüşünüzdən narazılıq, ağrı, hormonal və ya sağlamlıq dəyişiklikləri ola bilər. Ağrı varsa, həkim müayinəsi vacibdir. Bədənə münasibət isə yumşaq və səbirli işlə dəyişir."],w:"Dəstək alınmasa, çətinlik adətən özü-özünə keçmir, əksinə qorxu və utanc dövrəsi ilə daha da güclənə bilər. Yaxınlıqdan qaçmaq münasibətdə məsafə, rədd edilmə hissi və qarşılıqlı günahlandırma yaradır. Özünə inam azalır, narahatlıq və depressiya yarana bilər. Arxada tibbi səbəb varsa, vaxtında müalicə olunmaması vəziyyəti ağırlaşdıra bilər. Bu mövzuda dəstək almaq çox vaxt tez və yaxşı nəticə verir.",n:"Ağrı, qanaxma və ya ani dəyişiklik varsa əvvəlcə həkimə müraciət edin. Çətinlik bir neçə aydan çox davam edirsə, münasibətə təsir edirsə və ya zorakılıq və travma təcrübəsi ilə bağlıdırsa, cinsəl terapevtə və ya psixoloqa yazılın."},stress:{d:["Stress bədəninizdə özünü göstərir: boyun və çiyin gərginliyi, baş ağrısı, qarın sıxılması, sürətli ürək döyüntüsü. Bədəniniz təhlükə siqnalı verir, amma əslində təhlükə yoxdur və gərginlik boşalmır. Uzun müddət belə qalsa, yorğunluq və xəstəliyə meyl artır.","Fikirləriniz dayanmır, xüsusən gecə. Olmamış şeyləri təkrar-təkrar düşünürsünüz, qərar vermək çətinləşir, unutqanlıq yaranır. Zehniniz daim həll yolu axtarır, amma yorulduğu üçün daha da pisləşir.","Hissləriniz tez qalxır. Kiçik şey qıcıq yaradır, yaxınlara qəzəb çıxır, sonra peşmanlıq gəlir. Əvvəl xoş olan şeylər də yük görünür. Bu, xarakter deyil, yığılmış stresin nəticəsidir.","Yuxunuz və dincəlməniz pozulub. Yatmaq çətindir, tez-tez oyanırsınız, səhər yorğun qalxırsınız. Dincələndə günahkarlıq hissi olur. Bərpa olunmayan bədən stresə daha həssas olur və dövrə yaranır."],w:"Dəstək alınmasa və stress uzun müddət davam edərsə, bədən və psixika tükənə bilər. Yuxusuzluq, daimi baş və bel ağrıları, mədə və ürək-damar problemləri, immunitetin zəifləməsi yarana bilər. Psixoloji tərəfdən narahatlıq pozuntusu, panik ataklar, depressiya və iş-ailə münasibətlərində pozulmalar ehtimalı artır. Bəzi insanlar gərginliyi spirtli içki, siqaret və ya həddindən artıq yemək ilə azaltmağa çalışır və asılılıq yarana bilər.",n:"Gərginlik 2-4 həftədən çox davam edirsə, yuxu və iş pozulursa, sinə ağrısı, ürək döyüntüsü və ya nəfəs çətinliyi varsa əvvəlcə həkimə, sonra psixoloqa müraciət edin. Özünə zərər fikri olarsa dərhal kömək alın."},depression:{d:["Günün çox hissəsində kədər, boşluq və ya hissizlik var. Sevdiyiniz şeylər sevinc gətirmir, yaxşı xəbərə belə sevinmək çətindir. Bu halın iki həftədən çox davam etməsi depressiyanın əsas əlamətlərindən biridir.","Enerjiniz və həvəsiniz azalıb. Yataqdan qalxmaq, duş almaq, zəng etmək kimi sadə işlər ağır gəlir. Bu tənbəllik deyil, depressiyanın bədənə təsiridir. Özünüzü günahlandırdıqca daha da yorulursunuz.",'Özünüzə sərt düşüncələr, ümidsizlik və "yükəm" hissi güclənib. Bu düşüncələr həqiqəti əks etdirmir, depressiyanın dilidir. Yaşamaq istəməmək və ya özünə zərər düşüncəsi varsa, bu dərhal ciddi qəbul edilməli və mütəxəssislə danışılmalıdır.',"Yuxunuz, iştahanız, diqqətiniz və iş qabiliyyətiniz pozulub. Ya çox yatırsınız, ya az; ya çox yeyirsiniz, ya yeməkdən soyuyursunuz. İşdə və dərsdə nəticə düşür. Bu pozulmaların birlikdə olması peşəkar baxışa ehtiyac olduğunu göstərir."],w:"Dəstək alınmasa, depressiya uzana və dərinləşə bilər. Fəaliyyət azalır, iş və təhsil pisləşir, münasibətlər zəifləyir, insan tədricən təcrid olunur. Yuxu və iştaha pozulur, bədən xəstəliklərə həssas olur. Bəzi insanlar vəziyyəti spirtli içki və ya sakitləşdiricilərlə yüngülləşdirməyə çalışır və asılılıq yarana bilər. Ən ciddi risk özünə zərər düşüncələridir. Depressiya müalicə olunan haldır və kömək istəmək güc göstəricisidir.",n:"Əlamətlər iki həftədən çox davam edirsə, iş və ya münasibətlər pozulursa, yaşamaq istəməmək və ya özünə zərər fikri varsa mütəxəssisə (psixoloq və ya psixiatr) müraciət edin. Dərhal təhlükə hiss edirsinizsə 112-yə zəng edin."},panic:{d:["Atak zamanı bədəniniz güclü siqnal verir: ürək sürətlənir, nəfəs çatmır, əllər titrəyir, baş gicəllənir. Bu siqnallar qorxuducudur, amma adətən təhlükəli deyil və bir neçə dəqiqəyə keçir. Bədəniniz sadəcə təhlükə həyəcanını yanlış vaxtda verir.",'Bədən siqnalı fəlakət kimi oxunur: "ürək tutması", "dəli olmaq", "huşu itirmək". Bu fikir qorxunu artırır, qorxu siqnalı artırır və atak böyüyür. Fikirlərin dəyişməsi ataqın gücünü azaldır.',"Növbəti atak qorxusu həyatınızı daraldır. Metro, izdiham, lift kimi yerlərdən və ya təkbaşına çıxmaqdan qaçmağa başlamısınız. Qaçınma qısa müddətli rahatlıq verir, amma qorxunu böyüdür və dünyanı kiçildir.",'Atak zamanı "nəzarəti itirirəm" hissi güclüdür. Atakdan sonra yorğunluq, utanc və gərginlik qalır. Nəfəs və əsaslandırma texnikaları nəzarət hissini geri qaytarır.'],w:"Dəstək alınmasa, panik ataklar təkrarlana və qorxu öz-özünü gücləndirə bilər. Qaçınma davranışı genişlənir: metro, izdiham, mağaza, sonra isə evdən təkbaşına çıxmaq belə çətinləşir (agorafobiya). İş, təhsil və sosial həyat daralır. Yuxu pozulur, daimi narahatlıq və depressiya yarana bilər. Bəzi insanlar rahatlaşmaq üçün spirtli içki və sakitləşdiricilərə meyl edir. Düzgün terapiya ilə ataklar çox vaxt xeyli azalır və ya tamamilə keçir.",n:"Ataklar təkrarlanırsa, qaçınma yaranırsa və ya ilk dəfə sinə ağrısı, nəfəs çətinliyi yaşayırsınızsa həkimə (ürək və tiroid üçün), sonra psixoloqa müraciət edin. Atak zamanı sinə ağrısı keçmirsə təcili yardıma (112) zəng edin."},work:{d:["Enerjiniz işə gedir və sizə qalmır. İstirahətdən sonra da yorğun qalırsınız, bazar axşamı fikir sıxır. Bu, adi yorğunluqdan fərqlənir: yuxu və tətil bərpa etmir. Emosional tükənmə burnout-un əsas əlamətidir.","İşə qarşı soyuqluq və kinayə artıb. İşin mənası görünmür, həmkarlara və müştərilərə qıcıq olur. Bu çox vaxt özünü qoruma reaksiyasıdır: çox yorulan insan emosional məsafə yaradır.","Əvvəlki kimi təsirli olmadığınızı hiss edirsiniz. Çox işləsəniz də nəticə görmürsünüz, özünüzə inamınız azalır, səhvlər artır. Bu, bacarıq itkisi deyil, tükənmənin nəticəsidir və tükənmə azalanda bərpa olunur.",'İş şəxsi həyatınızın üzərinə keçib. İş saatlarından sonra da məşğulsunuz, "yox" demək çətindir, ailə və dostlara vaxt qalmır. Maaş və ya iş itirmək qorxusu dincəlməyə imkan vermir.'],w:"Dəstək alınmasa, tükənmə dərinləşib depressiyaya, narahatlıq pozuntusuna və fiziki xəstəliklərə (ürək, mədə, yuxu pozuntuları, immunitet zəifliyi) çevrilə bilər. İş keyfiyyəti və motivasiya düşür, səhvlər artır, işdən çıxmaq və ya karyeranı tərk etmək məcburiyyəti yarana bilər. Ailə və dostlarla münasibətlər zədələnir. Bəzi insanlarda spirtli içki, siqaret və ya sakitləşdiricilərə meyl yaranır. Erkən mərhələdə yük və sərhədlərin düzəldilməsi çox təsirlidir.",n:"Yuxu pozulursa, bədən simptomları (ürək döyüntüsü, mədə, baş ağrısı) başlayıbsa, işə getmək qorxu yaradırsa, depressiya əlamətləri və ya spirtli içkiyə meyl varsa mütəxəssisə müraciət edin. İş yükü barədə rəhbərlə danışmaq da vacibdir."},narc:{d:['Dediklərinizə və xatirələrinizə şübhə yaranır. Bir hadisəni olduğu kimi danışanda "uydurursan" və ya "belə olmayıb" cavabı gəlir və özünüzdən şübhələnməyə başlayırsınız. Bu davamlı olarsa, çaşqınlıq və öz hisslərinizə inamsızlıq yaranır.',"Münasibətdə yaxşı və pis günlər növbələşir. Mehribanlıq gələndə ümid yaranır, soyuqluq gələndə qorxu. Bu dəyişkənlik asılılığa bənzər bağ yaradır: yaxşı günü axtarır və pis günü bağışlayırsınız.",'Öz istəkləriniz arxa plana keçib. Qərarlarınızı onun reaksiyasına görə verirsiniz, "yox" demək qorxu doğurur. Sərhədləriniz tədricən itir və "özümü itirdim" hissi yaşaya bilərsiniz.','Özünüzə inam azalıb, dostlar və ailə ilə əlaqə zəifləyib. Daxili səsiniz sizə "yetərli deyilsən" deyir. Təcrid vəziyyəti daha da çətinləşdirir, çünki kənar baxış itir.'],w:"Dəstək alınmasa, belə münasibətin təsiri tədricən güclənə bilər. Özünə inam və öz reallığına etibar azalır, qərar vermək çətinləşir, insan dostlarından və ailəsindən uzaqlaşır. Davamlı gərginlik narahatlıq, panik, depressiya, yuxu və yemək pozuntuları yarada bilər. Münasibətdə təhdid, nəzarət və ya zorakılıq varsa, risk artır. Bu münasibətdən sağalmaq mümkündür və travma ilə işləyən mütəxəssis dəstəyi prosesi xeyli asanlaşdırır. Qeyd: bu test qarşı tərəfə diaqnoz qoymur.",n:"Qorxu, təhdid, nəzarət, maddi və ya fiziki zorakılıq varsa dərhal 112-yə zəng edin. Özünüzə inamınız çox azalıbsa, depressiya və ya panik əlamətləri başlayıbsa, qərar verə bilmirsinizsə travma bilən psixoloqa müraciət edin."},breakup:{d:["Ayrılıq itkidir və yas hissi təbiidir: kədər, boşluq, ağlamaq, yuxu və iştaha pozulması. Bu hisslər dalğa kimi gəlir. Yas vaxt tələb edir və ondan qaçmaq onu uzadır.",'Eyni fikirlər dayanmadan təkrarlanır: "Nə etməli idim?", "Nə səhv etdim?". Sosial şəbəkədən baxmaq və barışıq ssenariləri qurmaq ağrını yenidən canlandırır. Bu fikir dövrəsi sağalmanı ləngidir.','Tənhalıq və "mən kiməm?" sualı ön plandadır. Münasibət ortaq kimliyinizin böyük hissəsi olubsa, ayrılıq özünüzü itirmiş kimi hiss etdirə bilər. Öz maraqlarınıza və dostlarınıza qayıtmaq burada ən vacib addımdır.','Ayrılıq tam bitməyib: əlaqə, "dostluq", ortaq məsələlər və ya yazmaq istəyi davam edir. Aydın sərhəd olmadan ağrı uzanır. Bəzən bir müddət əlaqəsiz qalmaq sağalmanın şərtidir.'],w:"Dəstək alınmasa, normal yas prosesi uzanıb ilişə bilər. Düşüncə dövrələri, tənhalıq, yuxu və iştaha pozulmaları aylarla davam edə, depressiyaya və narahatlığa çevrilə bilər. İş və təhsildə nəticə düşür, insan sosial həyatdan çəkilir. Bəziləri ağrını azaltmaq üçün spirtli içkiyə və ya tələsik yeni münasibətə sığınır, bəziləri isə keçmiş partnyorla əlaqəni təkrar-təkrar bərpa edib ağrını uzadır. Vaxtında dəstək sağalmanı sürətləndirir.",n:"6-8 həftədən sonra da yuxu, iş və ya gündəlik həyat pozulursa, yaşamaq istəməmək və ya özünə zərər fikri varsa, spirtli içkiyə meyl artıbsa və ya münasibətdən sonra təqib və təhdid varsa mütəxəssisə müraciət edin. Təhlükə halında 112."}},IMG={family:"data:image/webp;base64,UklGRvg3AABXRUJQVlA4IOw3AADQaQGdASoIAigBPp1Cm0ilpCMmK7Q9UMATiWVuR8E0fSisj7Gb1Cb339UPk9L/yTx0pcmnnicsy9gv66aNcr+N//HrE7xQH3u5OhY7S85VhyWtKvdYSm2h+Vp4QHlHKvyQmxIvvFdCQDnVqx1rd/CM9Vhv8ugonH6EYhAUiq2odyKOwJicoemEuC22ydkxwTSbfArJ5mdBRw68qpQYjprTRbOzO0fA8fiDhm4/WdgDKgB+u2PPM8NnwRvf1r8Je45/i23a8dWfe/BGBuM4DOtvD4irLE25iHN9PsCpmTpQy5BF3Sxh4SvqxOIxXKmiTBp8BkCpFKspiIFkaWhOKlAWgCG9pEniLfJiri3ujW+rMdCT6ABRq0n8fQa9S6jyTUCASD58D4G+ayApe7LV4BOhMf/SlgbfV1UhFhxIGNkg4FPpnQWOLR9SxOSEL6Mmsbynxg61/On/m6FrJ202+SoNdw3X8Pv+dGf2xJoZURg5Wf+iX1gp5g+ns93Wf/w67z5fEish1wlqUst2eH3i1kuNkVLyt2f8tD19JIySpGJ+SkWHCZ5aNpgeFuZAUsRlK7QIpSOR7PBcFs4M6XxNPaEnYvUYOTGVZPsc9WI1kTWgO1ooIJBFDnwRBvnLlzQv7zuClxIkQSkR2DPIixr6pOxWOP+sZ1/HQCZOib/67l/1GfHT6q88tZm1fKhAZFciiBaZmQQcHOTP1On33/a/sKDj+9Nr8U+CoETS0WBwNaApSpyWBaNFIICVYiA8EuhNmv+pKECbzzYawMr4Yft4xwWZB70C/E6FrF+GIS3SQ9a5sBvUOfmBf8RbfTk2UOsm20sUK0C1hFV8HTjiuCdMAZ/seqTcs+ljCCSwg+Eh5zuYAskM6NO1YFAoqkjLTbN2VY0ZosG4unZdmLL1ws2b6qGBvzD12Y8AcKEPRwCx/DTzfs+RN5jK0woJI6skm/8vKvBOrBaVf7m1B4Zsi2s2lS1nAPJdP+CZ6aM5SOjcWtY6cZjhwMAQIxN7ARCXXhJBFMtBr/su0ZvOLU4eI+sXl/JAcYARQ692jhAJpBejDwWix536wsE3KwcVxIV9axiKWKuJwQT4pOUGmzfAH2lyD6S811uUgRw3didEQ5PBL/cTVvs8tTRfENEkIs52mFHOlB9HOJV9IbInWrDWf1rKFxRxL0U8gjYVomxVvix4F59I+NUjsOU4Yb8F3Vwc5EX7lKSJU17XLhpO0jsCIVEHcLlSHqecS0ajGcDURm97bLUW4xOvPVTpFzyLMpwDxnxqgByI5AlQFQr
